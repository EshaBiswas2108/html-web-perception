</style></head><body><div class="progress"><i id="progress"></i></div><aside class="sidebar" id="sidebar"><div class="brand"><span class="logo">P.</span><h2>The Perception<br>Lab</h2><p>A workplace judgment experiment</p></div><nav class="nav" id="nav" aria-label="Assignment pages"></nav><div class="sidefoot">LOOK AGAIN. THINK AGAIN.<br>10 chapters · 4 perceptual errors<br>Fictional cases for learning</div></aside><main><div class="topline"><button class="menu" onclick="toggleMenu()">Menu</button><span>Organizational behaviour / Interactive assignment</span><span class="pill">The human side of management</span></div><div id="view"></div></main><footer class="footer"><span class="small" id="pagecount"></span><div class="row"><button id="back" onclick="go(page-1)">Back</button><button class="primary" id="next" onclick="go(page+1)">Next</button></div></footer><script>
const chapters=[['Look again','the first impression'],['Four mental shortcuts','understand the concepts'],['The halo effect','the star presenter'],['The horn effect','one mistake, many labels'],['Stereotyping','the category trap'],['Selective perception','the evidence you notice'],['Evidence detective','choose what to investigate'],['Name that error','a five-round challenge'],['Profile swap','first impressions under review'],['Your takeaway','reflect & export']];
let page=0;const state={cases:{},detect:[],quiz:{},swap:{round:0,ratings:[{},{}],locked:[false,false],reveal:false},reflection:''};
const cases=[{name:'Halo effect',title:'A great presentation.<br>A great employee?',person:'Aarav · project coordinator',cue:'Aarav gives a confident, polished presentation. The manager immediately describes him as reliable, detail-oriented and ready to lead a complex project.',question:'How strong is the evidence that Aarav is ready to lead the project?',definition:'A positive impression in one area spills into judgments about other, untested qualities.',risk:'Presentation skill is relevant to communication. It does not, by itself, establish planning skill or accuracy.',facts:['The presentation was clear and well structured.','Two of his last four project plans needed major corrections to budgets.','Three of four milestones were delivered on time. Leadership of a full team has not yet been observed.'],lesson:'Keep the communication strength. Assess budgeting and leadership separately. A supervised stretch assignment with clear checkpoints could gather useful evidence.',prompt:'What evidence would you need before making a promotion decision?'},{name:'Horn effect',title:'One late arrival.<br>A whole-person label.',person:'Mira · operations analyst',cue:'Mira arrives 15 minutes late to a client meeting. Her manager concludes that she is careless, uncommitted and probably weak at analysis.',question:'How strong is the evidence that Mira is generally unreliable?',definition:'A negative impression in one area spreads to judgments about unrelated qualities.',risk:'A late arrival is an observation. “Uncommitted” is an interpretation that needs more evidence.',facts:['This was her first late arrival in six months; she notified the team before the meeting.','A verified rail disruption delayed her journey.','Her last six reports met deadlines and passed accuracy checks. The delayed meeting still needs an apology and a backup plan.'],lesson:'Address the actual impact without converting a single event into a personality verdict. Her track record weakens the claim of general unreliability.',prompt:'How would you discuss the late arrival while acknowledging her broader performance?'},{name:'Stereotyping',title:'Read the person.<br>Not the category.',person:'Dev · experienced team member',cue:'Dev is 56. A manager assumes he will struggle with new software and leaves him out of a digital transformation project without checking his skills or interest.',question:'How strong is the evidence that Dev would struggle with the software?',definition:'A belief about a group substitutes for evidence about an individual.',risk:'Age, gender, background or department should not stand in for demonstrated job-related ability. Positive stereotypes can also create unfair expectations.',facts:['Dev recently completed the relevant software certification.','He built a workflow that reduced duplicate data entry in a pilot.','He wants to join the project but has not yet used one advanced module. Other applicants also need a consistent skills check.'],lesson:'Use the same work sample and criteria for all candidates. Identify the specific training gap rather than treating age as a measure of capability.',prompt:'What opportunity was lost when the manager relied on a group assumption?'},{name:'Selective perception',title:'Same employee.<br>A different filter.',person:'Nisha · hybrid team member',cue:'A manager believes remote employees are less productive. They remember Nisha’s delayed chat reply, but overlook her completed work and client feedback.',question:'How strong is the evidence that Nisha is less productive because she works remotely?',definition:'Expectations, interests or experience shape which information receives attention and how it is interpreted.',risk:'Unlike halo or horn, the central problem here is filtering the evidence. It can overlap with confirmation bias when someone favours evidence supporting an existing belief.',facts:['Nisha delivered nine of ten tasks on schedule; the team average was eight of ten.','The slow chat reply occurred during a scheduled client workshop.','One handover did miss an agreed response window. The team has not defined response expectations for different types of messages.'],lesson:'Include supporting and challenging evidence. Review outputs and availability as distinct criteria, and agree on response expectations instead of using online visibility as a proxy for productivity.',prompt:'Which facts did the manager notice, and which did they leave out?'}];
const quiz=[['A manager rates every skill highly because an employee won a speaking contest.',0,'Halo effect: a visible strength is spreading into untested skill ratings.'],['After one typo, a manager assumes an employee is also poor at teamwork.',1,'Horn effect: a single negative cue contaminates an unrelated judgment.'],['“People from that department are never creative,” says a manager without reviewing their proposals.',2,'Stereotyping: a department label replaces individual evidence.'],['A manager expects failure and records complaints while ignoring positive customer reports.',3,'Selective perception: the evidence is being filtered through an expectation.'],['A manager investigates repeated verified errors using the same quality standard for everyone.',4,'No clear perceptual error is shown. An unfavourable judgment can be justified by relevant evidence.']];
function toggleMenu(){document.getElementById('sidebar').classList.toggle('open')}
function go(n){if(n<0||n>=chapters.length)return;page=n;document.getElementById('sidebar').classList.remove('open');render();window.scrollTo({top:0,behavior:'smooth'})}
function heading(k,t,d){return `<div class="eyebrow">${k}</div><h1>${t}</h1><p class="lead">${d}</p>`}
function render(){document.getElementById('nav').innerHTML=chapters.map((c,i)=>`<button class="${page===i?'active':''}" ${page===i?'aria-current="page"':''} onclick="go(${i})"><span class="num">${String(i+1).padStart(2,'0')}</span><span><b>${c[0]}</b><small>${c[1]}</small></span></button>`).join('');document.getElementById('progress').style.width=((page+1)/10*100)+'%';document.getElementById('pagecount').textContent=`${page+1} / 10 · ${chapters[page][0]}`;document.getElementById('back').disabled=page===0;document.getElementById('next').disabled=page===9;let html='';
if(page===0)html=heading('Welcome to the experiment','Your first impression<br>is only the first draft.','Perceptual Errors: Halo Effect, Horn Effect, Stereotyping and Selective Perception. Explore how managers judge people with incomplete information—and what changes when they look again.')+`<div class="grid"><div class="card butter"><div class="eyebrow">The central question</div><p class="quote" style="margin-top:16px">Are you judging the work,<br>or the story in your head?</p><p>In this lab, you become the manager. Make a provisional judgment, open the evidence file, and decide whether to revise it.</p><button class="primary" onclick="go(2)">Try the first case</button></div><div class="card art"><div class="lens"><span>?</span></div></div></div><div class="grid"><div><h3>What you will learn</h3><ul><li>Distinguish four common perceptual errors.</li><li>Separate observations from assumptions.</li><li>Revise judgments using relevant evidence.</li><li>Test how one prominent detail changes a candidate scorecard.</li></ul></div><div><h3>How to use the lab</h3><p>Work through the sidebar in order, or jump to an activity. Discuss your choices with a classmate. Finish by exporting your reflection.</p><p class="small">About 20–30 minutes. Activities are illustrative, not a psychological test. Responses stay in this open tab; download them before closing.</p></div></div>`;
if(page===1)html=heading('01 / Concept map','Four shortcuts.<br>Four ways to miss the person.','Perception is how we select and interpret information. Shortcuts help us cope with complexity, but they can distort hiring, feedback, task allocation and promotion.')+`<div class="grid">${cases.map((c,i)=>`<div class="card ${['butter','peach','sage','blue'][i]}"><span class="eyebrow">0${i+1}</span><h2 style="margin-top:12px">${c.name}</h2><p>${c.definition}</p><button onclick="go(${i+2})">Explore case</button></div>`).join('')}</div><div class="note"><b>Use these as lenses, not labels for people.</b><br>Errors can overlap. A confident presentation may create a halo, which then encourages selective attention to later successes.</div><h3>Observation, interpretation, decision</h3><p>“She asked no questions in this meeting” is an observation. “She is disengaged” is an interpretation. “Exclude her from the next project” is a decision. Check the missing links before acting.</p>`;
if(page>=2&&page<=5)html=caseView(page-2);
if(page===6)html=detectView();
if(page===7)html=quizView();
if(page===8)html=swapView();
if(page===9)html=summaryView();
document.getElementById('view').innerHTML=html;if(page===9)document.getElementById('reflection').value=state.reflection;
}
function caseView(i){let c=cases[i],s=state.cases[i]||{};return heading('Case file 0'+(i+1)+' / '+c.name,c.title,c.definition)+`<div class="grid"><div class="card ${['butter','peach','sage','blue'][i]}"><div class="eyebrow">The first impression</div><h3 style="margin-top:14px">${c.person}</h3><p class="quote">${c.cue}</p><p class="small">${c.risk}</p></div><div class="card"><div class="eyebrow">Your provisional judgment</div><h3 style="margin-top:14px">${c.question}</h3><div class="options">${['Weak / insufficient','Mixed / uncertain','Strong'].map((v,j)=>`<button ${s.initial!==undefined?'disabled':''} class="${s.initial===j?'selected':''}" onclick="initial(${i},${j})">${v}</button>`).join('')}</div><p class="small">Choose before opening the evidence. Your answer records the strength of the evidence, not the employee’s worth.</p>${s.initial!==undefined&&!s.reveal?`<button class="primary" onclick="reveal(${i})">Open the evidence file</button>`:''}${s.initial===undefined?'<p class="small">Evidence file locked until you choose.</p>':''}</div></div>${s.reveal?`<div class="card"><div class="eyebrow">Additional information</div>${c.facts.map(f=>`<div class="evidence">${f}</div>`).join('')}<h3 style="margin-top:24px">Now, how strong is the evidence for the original claim?</h3><div class="row">${['Weak / insufficient','Mixed / uncertain','Strong'].map((v,j)=>`<button class="${s.revised===j?'selected':''}" onclick="revise(${i},${j})">${v}</button>`).join('')}</div>${s.revised!==undefined?caseFeedback(i,s):''}</div><div class="note"><b>Discuss with a partner</b><br>${c.prompt}</div>`:''}<button onclick="resetCase(${i})">Restart this case</button>`}
function initial(i,j){state.cases[i]={initial:j};render()}function reveal(i){state.cases[i].reveal=true;render()}function revise(i,j){state.cases[i].revised=j;render()}function resetCase(i){delete state.cases[i];render()}
const clues=[['Deadline records','Compare promised and actual delivery dates across several projects.',true],['One colleague’s nickname','“The lazy one” is a label, not a record of behaviour.',false],['Work samples','Review output quality against the same criteria used for peers.',true],['Social media popularity','Followers do not establish performance in this role.',false],['Employee’s account','Ask about workload, dependencies and what happened; verify relevant claims.',true],['Office attendance alone','Presence may matter for a specific duty, but does not establish overall output.',false]];
function detectView(){return heading('Game / Evidence detective','What would you<br>investigate first?','Rohan missed a project deadline. A manager says, “He is not committed.” Choose three information sources that best test this claim. Then open your investigation review.')+`<div class="card butter"><b>Your mission:</b> choose useful evidence, not simply evidence that agrees with the manager.<div class="row" style="margin-top:12px"><span class="pill">${state.detect.length} / 3 selected</span></div></div><div class="grid">${clues.map((c,i)=>`<button class="card ${state.detect.includes(i)?'selected':''}" aria-pressed="${state.detect.includes(i)}" onclick="pickClue(${i})"><h3>${c[0]}</h3><span class="small">${state.detect.includes(i)?'Selected':'Select this source'}</span></button>`).join('')}</div><button class="primary" ${state.detect.length!==3?'disabled':''} onclick="state.detectDone=true;render()">Review my investigation</button> <button onclick="state.detect=[];state.detectDone=false;render()">Reset</button>${state.detectDone?`<div class="feedback good"><h3>${state.detect.filter(i=>clues[i][2]).length} / 3 high-value sources selected</h3>${state.detect.map(i=>`<p><b>${clues[i][0]}:</b> ${clues[i][1]}</p>`).join('')}<p><b>Best starting set:</b> deadline records, work samples and the employee’s account. Together they examine patterns, quality and context. Missing one deadline still deserves a conversation; motivation cannot be read directly from that event.</p></div>`:''}`}
function pickClue(i){state.detectDone=false;if(state.detect.includes(i))state.detect=state.detect.filter(x=>x!==i);else if(state.detect.length<3)state.detect.push(i);render()}
function quizView(){let done=Object.keys(state.quiz).length,correct=Object.entries(state.quiz).filter(([i,a])=>quiz[i][1]===a).length;return heading('Game / Name that error','Spot the shortcut.','Choose the best explanation for each manager’s behaviour. Real situations can contain several errors; these short cases emphasise one mechanism.')+`<div class="row" style="margin-bottom:24px"><span class="pill">${done} / 5 answered</span><span class="pill">${correct} correct</span></div>${quiz.map((q,i)=>`<div class="card"><div class="eyebrow">Round ${i+1}</div><h3 style="margin-top:12px">${q[0]}</h3><div class="row">${['Halo','Horn','Stereotyping','Selective perception','No clear error'].map((v,j)=>`<button ${state.quiz[i]!==undefined?'disabled':''} class="${state.quiz[i]===j?'selected':''}" onclick="state.quiz[${i}]=${j};render()">${v}</button>`).join('')}</div>${state.quiz[i]!==undefined?`<div class="feedback ${state.quiz[i]===q[1]?'good':''}"><b>${state.quiz[i]===q[1]?'Correct.':'Look again.'}</b> ${q[2]}</div>`:''}</div>`).join('')}<button onclick="state.quiz={};render()">Play again</button><p class="small" style="margin-top:16px">This score checks concept recognition only. It does not measure how biased a person is.</p>`}

function caseFeedback(i,s){const labels=['weak / insufficient','mixed / uncertain','strong'];const claims=['Aarav is ready to lead a complex project','Mira is generally unreliable','Dev would struggle with the software','Nisha is less productive because she works remotely'];const reasons=[
'His presentation supports a positive judgment about communication. However, budget corrections raise a separate planning concern, and there is no direct observation of people leadership. Good speaking cannot fill those evidence gaps.',
'The late arrival is real, but a verified disruption, advance notification and six timely, accurate reports give a different picture of her normal performance. One incident is weak support for a broad label such as “unreliable.”',
'His certification and successful workflow provide individual evidence of capability. The unfamiliar advanced module is a specific learning need; his age does not establish that he will struggle.',
'Her delivery record and the scheduled workshop challenge the manager’s productivity claim. A missed handover is a specific coordination issue. These facts do not show that remote work caused lower productivity.'];let direction=s.revised<s.initial?'You now see less support for the manager’s claim.':s.revised>s.initial?'You now see more support for the manager’s claim.':'Your level of support stayed the same after reviewing the new facts.';return `<div class="feedback expanded" aria-live="polite"><div class="eyebrow">Your judgment, explained</div><h2 style="margin-top:12px">${s.initial===s.revised?'You kept your judgment.':'You revised your judgment.'}</h2><p>You first rated the evidence as <b>${labels[s.initial]}</b>. After opening the file, you rated it as <b>${labels[s.revised]}</b>. ${direction}</p><div class="note"><b>The claim you are evaluating:</b> “${claims[i]}.”<br>You are rating support for this claim—not rating the person’s value or overall ability.</div><h3>What the new information actually tells us</h3><p>${reasons[i]}</p><h3>How to interpret your choice</h3><p>${s.revised===2?'A strong rating needs more justification here. The file contains contrary evidence or important gaps, so it does not securely establish the manager’s broad claim. Identify what additional job-relevant evidence would be needed before acting.':s.revised===1?'A mixed rating expresses uncertainty. Be precise about what remains uncertain: a specific skill or event may need investigation even when the manager’s broad conclusion is poorly supported.': 'A weak rating means the available facts do not justify this broad claim. It does not prove the opposite, guarantee future success or erase any specific performance issue.'}</p><h3>A fair next step</h3><p>${cases[i].lesson}</p><span class="tag">${cases[i].name}: ${['separate the strengths','contain the negative cue','check individual evidence','look beyond your expectation'][i]}</span></div>`}
const dimensions=['Analytical skill','Reliability','Teamwork'];
const swapCues=[['Award spotlight','Won a university public-speaking award.','Once submitted a slide with a typo.'],['Details swapped','Once submitted a slide with a typo.','Won a university public-speaking award.']];
function scoreLabel(v){return v===0?'Not enough evidence':v===undefined?'Not rated':v+' / 5'}
function swapView(){let g=state.swap,r=g.round;let count=Object.keys(g.ratings[r]).length;return heading('Game / First-Impression Resume / Profile Swap','One detail.<br>A different scorecard?','Rate two mock candidates, swap their prominent details, then compare your decisions. Work alone or let two groups rate independently before discussing the results.')+`<div class="gameSteps"><span class="${r===0&&!g.reveal?'current':''}">01 · First impressions</span><span class="${r===1&&!g.reveal?'current':''}">02 · Swap the detail</span><span class="${g.reveal?'current':''}">03 · Compare & discuss</span></div><div class="note"><b>Role: junior business analyst.</b> Both candidates have the same qualification and six months of internship experience. No work samples, attendance record or teamwork evidence are available yet. Rate the three dimensions below using 1 (low) to 5 (high), or choose “Not enough evidence.”</div>${!g.reveal?`<div class="row" style="margin-bottom:20px"><span class="pill">Round ${r+1} of 2</span><span class="pill">${count} / 6 ratings recorded</span></div><div class="grid">${['A','B'].map((n,c)=>`<div class="card candidate"><div class="row"><div class="avatar">${n}</div><div><div class="eyebrow">Candidate ${n}</div><h2 style="margin:4px 0">Mock profile ${n}</h2></div></div><p class="small" style="margin-top:18px">Graduate · 6-month internship · Junior analyst applicant</p><div class="spotlight"><span class="eyebrow">${swapCues[r][0]}</span><p class="quote" style="margin:10px 0 0">${swapCues[r][c+1]}</p></div>${dimensions.map((d,j)=>{let k=c+'-'+j;return `<fieldset><legend>${d}</legend><div class="rating">${[1,2,3,4,5,0].map(v=>`<button class="${g.ratings[r][k]===v?'selected':''}" aria-pressed="${g.ratings[r][k]===v}" ${g.locked[r]?'disabled':''} onclick="rateSwap('${k}',${v})">${v||'Not enough evidence'}</button>`).join('')}</div></fieldset>`}).join('')}</div>`).join('')}</div><button class="primary" ${count!==6?'disabled':''} onclick="advanceSwap()">${r===0?'Lock ratings & swap details':'Lock ratings & reveal comparison'}</button><p class="small" style="margin-top:14px">${r===1?'Only the two highlighted details have switched. The role and basic qualifications remain identical.':'There is no reward for a high or low score. Notice which facts your ratings rely on.'}</p>`:swapResults()}<button style="margin-top:20px" onclick="resetSwap()">Restart profile game</button>`}
function rateSwap(k,v){const g=state.swap;if(g.reveal||g.locked[g.round])return;g.ratings[g.round][k]=v;render()}
function advanceSwap(){const g=state.swap;if(Object.keys(g.ratings[g.round]).length!==6)return;g.locked[g.round]=true;if(g.round===0)g.round=1;else g.reveal=true;render()}
function resetSwap(){state.swap={round:0,ratings:[{},{}],locked:[false,false],reveal:false};render()}
function swapResults(){const g=state.swap;let changes=Object.keys(g.ratings[0]).filter(k=>g.ratings[0][k]!==g.ratings[1][k]).length;return `<div class="card butter"><div class="row"><div class="big">${changes}<span style="font-size:22px"> / 6</span></div><div><h2>Ratings changed after the swap</h2><p style="margin:0">The qualifications did not change. The prominent detail did.</p></div></div></div><div class="tablewrap"><table><caption>Compare each candidate before and after the detail swap</caption><thead><tr><th>Candidate / dimension</th><th>First impression</th><th>After swap</th><th>Change</th></tr></thead><tbody>${['A','B'].map((n,c)=>dimensions.map((d,j)=>{let k=c+'-'+j,a=g.ratings[0][k],b=g.ratings[1][k];return `<tr><th>${n} · ${d}</th><td>${scoreLabel(a)}</td><td>${scoreLabel(b)}</td><td>${a===b?'Unchanged':a===0||b===0?'Evidence judgment changed':(b>a?'+':'')+(b-a)+' points'}</td></tr>`}).join('')).join('')}</tbody></table></div><div class="grid"><div class="card sage"><h3>What might the pattern mean?</h3><p>${changes?'Some of your ratings moved when the detail moved. Check whether each shift has a relevant evidence-based reason. A movement alone is not proof of bias.':'Your ratings stayed stable. That can reflect resistance to the prominent cue, but unchanged ratings are not automatically justified—check the evidence behind them.'}</p><p>An award may create a <b>halo</b> if it inflates analytical skill, reliability or teamwork without supporting evidence. A typo may create a <b>horn effect</b> if it lowers every rating.</p></div><div class="card peach"><h3>Where is the evidence?</h3><p>The speaking award concerns a specific performance. The typo concerns one isolated error. Neither establishes this entire scorecard. “Not enough evidence” is a reasonable response for these dimensions.</p><p>A hobby could be swapped in during a classroom replay. Ask whether liking the same hobby changes a rating without changing job-related facts.</p></div></div><div class="card"><h2>Group debrief</h2><ol><li>Which dimension moved most? Point to the detail that influenced it.</li><li>Did the award inflate unrelated scores or the mistake lower them?</li><li>Did you invent a story to defend your original rating? What did you overlook?</li><li>What would test each dimension? Try an analysis task, delivery records and a structured teamwork example.</li></ol><p class="small">Compare results aloud or on a classroom board. This file records one participant or group at a time; it does not collect a live group poll. Ratings are a learning exercise, not a hiring tool or bias diagnosis.</p></div>`}
function summaryView(){let complete=Object.values(state.cases).filter(s=>s.revised!==undefined).length;return heading('Reflection / Bring it back to work','A better judgment<br>leaves room to change.','The aim is not to avoid every first impression. It is to recognise an impression as provisional, investigate it and make a decision that the evidence can support.')+`<div class="grid"><div class="card butter"><div class="big">${complete}<span style="font-size:26px"> / 4</span></div><h3 style="margin-top:14px">Case files reconsidered</h3><p>Changing your mind is not the only sign of learning. Keeping a judgment can be reasonable when the evidence still supports it.</p></div><div class="card sage"><h3>Remember the four questions</h3><p><b>Halo:</b> Am I generalising from one strength?<br><b>Horn:</b> Am I generalising from one weakness?<br><b>Stereotyping:</b> Am I substituting a group for a person?<br><b>Selective perception:</b> Which evidence am I overlooking?</p></div></div>${takeawaySwap()}<div class="card"><h2>Your assignment reflection</h2><p>Reflect on the profile swap: which ratings changed when the award and typo switched candidates? Which changes lacked job-related evidence? Link your experience to halo or horn effects, then explain how stereotypes or selective attention might reinforce an initial impression. Name one better evidence source for each dimension.</p><label for="reflection" class="small">Write your response</label><textarea id="reflection" placeholder="Initially, the manager assumed… The additional evidence showed… A fairer decision would be…" oninput="state.reflection=this.value"></textarea><div class="row" style="margin-top:16px"><button class="primary" onclick="download()">Download my reflection</button><button onclick="window.print()">Print this page</button></div><p class="small" style="margin-top:12px">The download includes your case choices, quiz results and both profile-swap scorecards. Save before closing this tab.</p></div><details class="card"><summary><b>References & content notes</b></summary><p style="margin-top:16px">Concept background: Black, J. S., & Bright, D. S. (2019). <i>Organizational Behavior</i>, OpenStax.</p><ul><li><a href="https://openstax.org/books/organizational-behavior/pages/3-1-the-perceptual-process" target="_blank" rel="noopener">3.1 The Perceptual Process</a> — halo, horn and attention.</li><li><a href="https://openstax.org/books/organizational-behavior/pages/3-2-barriers-to-accurate-social-perception" target="_blank" rel="noopener">3.2 Barriers to Accurate Social Perception</a> — stereotyping and selective perception.</li></ul><p class="small">All named employees, scenarios, figures and games in this assignment are fictional teaching examples. The activities are not validated assessments. No personal information is sent from this HTML file.</p></details>`}
function takeawaySwap(){return `<div class="card butter"><div class="eyebrow">Your profile-swap takeaway</div><h2 style="margin-top:12px">Keep the detail in proportion.</h2><p>${state.swap.reveal?'You completed both rounds. Compare each shift in your scorecard with the evidence actually available. A more favourable detail should not automatically improve every skill rating.':'Complete the profile-swap game on page 9 to compare how one detail influences several ratings.'}</p><p><b>Before a real decision:</b> define the criteria, ask for evidence for each skill and actively look for information that could challenge your first impression. Keep “unknown” separate from “poor.”</p><button onclick="go(8)">${state.swap.reveal?'Review my scorecards':'Play the profile swap'}</button></div>`}
function swapExport(){if(!state.swap.reveal)return 'Game not completed.';return ['A','B'].map((n,c)=>dimensions.map((d,j)=>{let k=c+'-'+j;return n+' / '+d+': '+scoreLabel(state.swap.ratings[0][k])+' initially; '+scoreLabel(state.swap.ratings[1][k])+' after swap.'}).join('\n')).join('\n')}
function download(){let labels=['Weak / insufficient','Mixed / uncertain','Strong'];let text='PERCEPTUAL ERRORS — ASSIGNMENT REFLECTION\n\n'+cases.map((c,i)=>{let s=state.cases[i]||{};return c.name+'\nInitial: '+(labels[s.initial]||'Not answered')+'\nRevised: '+(labels[s.revised]||'Not answered')}).join('\n\n')+'\n\nConcept quiz: '+Object.entries(state.quiz).filter(([i,a])=>quiz[i][1]===a).length+' correct from '+Object.keys(state.quiz).length+' answered (5 total).\n\nMY REFLECTION\n'+(state.reflection||'No reflection entered.')+'\n\nThese activities are fictional teaching examples, not a bias assessment.';const u=URL.createObjectURL(new Blob([text],{type:'text/plain;charset=utf-8'}));const a=document.createElement('a');a.href=u;a.download='Perceptual_Errors_My_Reflection.txt';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}
document.addEventListener('keydown',e=>{if(['INPUT','TEXTAREA','BUTTON'].includes(document.activeElement.tagName))return;if(e.key==='ArrowRight')go(page+1);if(e.key==='ArrowLeft')go(page-1);if(e.key==='Escape')document.getElementById('sidebar').classList.remove('open')});render();
</script></body></html>
